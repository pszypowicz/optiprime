# Opens one pull request a week that moves the pinned action SHAs in
# .github/workflows, and their version comments, to the latest releases.
# A release is proposed only after it has been public for a week.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
