name: release

on:
  push:
    tags:
      - 'v*'

permissions: {}

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The release environment holds the homebrew-tap App key and accepts
    # only v* tags, so no other workflow or ref can read the key.
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release builds without the module cache, so a cache that another
      # workflow wrote cannot end up in the published binaries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # A token for the GitHub App that may write only to homebrew-tap.
      # GoReleaser uses it to open the pull request that updates the cask.
      - id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      # The App's bot user id forms the noreply address of the cask commits.
      - id: tap-bot
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      # An exact GoReleaser version, so a new release of it never runs here
      # untested. The cask config needs v2.20 or later.
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          HOMEBREW_TAP_BOT_NAME: ${{ steps.tap-token.outputs.app-slug }}[bot]
          HOMEBREW_TAP_BOT_EMAIL: ${{ steps.tap-bot.outputs.id }}+${{ steps.tap-token.outputs.app-slug }}[bot]@users.noreply.github.com

      # Signs a build provenance attestation for every archive listed in
      # checksums.txt. Check one with `gh attestation verify`.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: ./dist/checksums.txt
