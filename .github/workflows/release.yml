name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # A release builds without the module cache, so a cache that another
      # workflow wrote cannot end up in the published binaries.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      # A token for the GitHub App that may write only to homebrew-tap.
      # GoReleaser uses it to open the pull request that updates the cask.
      - id: tap-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.HOMEBREW_TAP_APP_CLIENT_ID }}
          private-key: ${{ secrets.HOMEBREW_TAP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: homebrew-tap
          permission-contents: write
          permission-pull-requests: write

      # The App's bot user id forms the noreply address of the cask commits.
      - id: tap-bot
        env:
          GH_TOKEN: ${{ steps.tap-token.outputs.token }}
          APP_SLUG: ${{ steps.tap-token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      # The cask config needs v2.20 or later: install_steps hooks (v2.19) and
      # the zap stanza that current Homebrew expects (v2.20).
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: "~> v2.20"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ steps.tap-token.outputs.token }}
          HOMEBREW_TAP_BOT_NAME: ${{ steps.tap-token.outputs.app-slug }}[bot]
          HOMEBREW_TAP_BOT_EMAIL: ${{ steps.tap-bot.outputs.id }}+${{ steps.tap-token.outputs.app-slug }}[bot]@users.noreply.github.com
